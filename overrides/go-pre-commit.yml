# blairham/go-pre-commit's approved departures from the baseline.
overrides:
  - knob: gitleaks.allowlist
    reason: >-
      Carried over verbatim from go-pre-commit's .gitleaks.toml (2026-10-08). Test files hold fake credentials as hook fixtures, and build/ is this repo's build output.
    value: |
      [allowlist]
      description = "Global allowlist for false positives"

      # Files to ignore completely
      paths = [
          # Test files often contain fake/example credentials
          '''.*_test\.go''',
          # Build output
          '''^build/''',
          # Vendored dependencies
          '''^vendor/''',
      ]
  - knob: golangci.linters-pending
    reason: >-
      Staged adoption: go-pre-commit runs 9 of the baseline's linters and
      adopts the rest one per pull request, each landing only once the whole
      tree is clean under it. This list shrinks to empty.
    value:
      - whitespace
      - unparam
      - goconst
      - bodyclose
      - contextcheck
      - rowserrcheck
      - sqlclosecheck
      - errname
      - errorlint
      - forcetypeassert
      - nilerr
      - nilnil
      - noctx
      - predeclared
      - prealloc
      - sloglint
      - gosec
      - nestif
      - funlen
      - gocognit
      - gocyclo
      - thelper
      - tparallel
      - testableexamples
      - importas
      - interfacebloat
      - wastedassign
  - knob: pre-commit.generated-exclude
    value: ^(dist/|build/)
    reason: build/ is this repository's build output directory, alongside GoReleaser's dist/.
