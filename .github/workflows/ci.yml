name: CI

# blairham/.github's own CI calls its own go-ci.yml by local path, so every
# change to the reusable workflow runs it before any other repository pins it.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request ever built, so the merge
    # result gets its own run rather than inheriting the branch's green tick.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job: it explores on main and on this
    # schedule, never on a pull request.
    - cron: '23 5 * * 2'

permissions:
  contents: read

concurrency:
  # A superseded push is not worth finishing; only the newest commit matters.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/go-ci.yml

  # The baseline governs this repository too: its own synced files must be
  # exactly what `make sync` renders, and every overrides file must parse.
  baseline:
    name: Baseline in sync
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.ci.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.ci.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Every override names a knob and a reason
        if: needs.ci.outputs.code == 'true'
        run: go run ./cmd/baseline overrides
      - name: This repository matches its own baseline
        if: needs.ci.outputs.code == 'true'
        run: |
          go run ./cmd/baseline sync -repo .github -dir .
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # go-changes.yml by local path, consumed the way a caller consumes it.
  changes:
    name: Changes
    uses: ./.github/workflows/go-changes.yml
    with:
      filters: '{"workflows": ["^\\.github/"], "never": ["^no-such-path$"]}'

  changes-consumer:
    name: Changes consumer
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Read go-changes.yml's outputs as a caller would
        env:
          CODE: ${{ needs.changes.outputs.code }}
          MATCHES: ${{ needs.changes.outputs.matches }}
          NEVER: ${{ fromJSON(needs.changes.outputs.matches).never }}
        run: |
          set -euo pipefail
          echo "code=$CODE matches=$MATCHES"
          case "$CODE" in true|false) ;; *) echo "::error::code is '$CODE'"; exit 1 ;; esac
          jq -e 'keys == ["never", "workflows"]' <<<"$MATCHES"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$NEVER" != false ]; then
            echo "::error::'never' matched on a pull request"
            exit 1
          fi

  # The changes action exactly as go-ci.yml and go-changes.yml run it, by
  # local path, so a change to action.yml is exercised before anything pins
  # it. internal/changes tests the script's answers; this checks the wiring.
  changes-action:
    name: Changes action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/changes
        with:
          filters: '{"workflows": ["^\\.github/"], "never": ["^no-such-path$"]}'
      - name: The outputs have the documented shape
        env:
          CODE: ${{ steps.changes.outputs.code }}
          MATCHES: ${{ steps.changes.outputs.matches }}
          NEVER: ${{ fromJSON(steps.changes.outputs.matches).never }}
        run: |
          set -euo pipefail
          echo "code=$CODE matches=$MATCHES"
          case "$CODE" in true|false) ;; *) echo "::error::code is '$CODE'"; exit 1 ;; esac
          jq -e 'keys == ["never", "workflows"] and all(.[]; . == "true" or . == "false")' <<<"$MATCHES"
          # A path no change can touch matches only when everything runs.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$NEVER" != false ]; then
            echo "::error::'never' matched on a pull request"
            exit 1
          fi
