name: CI

# blairham/.github's own CI calls its own go-ci.yml by local path, so every
# change to the reusable workflow runs it before any other repository pins it.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    # A squash merge lands a tree no pull request ever built, so the merge
    # result gets its own run rather than inheriting the branch's green tick.
    branches: [main]
  schedule:
    # Weekly, for go-ci.yml's Fuzz job: it explores on main and on this
    # schedule, never on a pull request.
    - cron: '23 5 * * 2'

permissions:
  contents: read

concurrency:
  # A superseded push is not worth finishing; only the newest commit matters.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/go-ci.yml

  # The baseline governs this repository too: its own synced files must be
  # exactly what `make sync` renders, and every overrides file must parse.
  baseline:
    name: Baseline in sync
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.ci.outputs.code == 'true'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: needs.ci.outputs.code == 'true'
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true
      - name: Every override names a knob and a reason
        if: needs.ci.outputs.code == 'true'
        run: go run ./cmd/baseline overrides
      - name: This repository matches its own baseline
        if: needs.ci.outputs.code == 'true'
        run: |
          go run ./cmd/baseline sync -repo .github -dir .
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

  # go-changes.yml by local path, consumed the way a caller consumes it.
  changes:
    name: Changes
    uses: ./.github/workflows/go-changes.yml
    with:
      filters: '{"workflows": ["^\\.github/"], "never": ["^no-such-path$"]}'

  changes-consumer:
    name: Changes consumer
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Read go-changes.yml's outputs as a caller would
        env:
          CODE: ${{ needs.changes.outputs.code }}
          MATCHES: ${{ needs.changes.outputs.matches }}
          NEVER: ${{ fromJSON(needs.changes.outputs.matches).never }}
        run: |
          set -euo pipefail
          echo "code=$CODE matches=$MATCHES"
          case "$CODE" in true|false) ;; *) echo "::error::code is '$CODE'"; exit 1 ;; esac
          jq -e 'keys == ["never", "workflows"]' <<<"$MATCHES"
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$NEVER" != false ]; then
            echo "::error::'never' matched on a pull request"
            exit 1
          fi

  # The changes action exactly as go-ci.yml and go-changes.yml run it, by
  # local path, so a change to action.yml is exercised before anything pins
  # it. internal/changes tests the script's answers; this checks the wiring.
  changes-action:
    name: Changes action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        uses: ./.github/actions/changes
        with:
          filters: '{"workflows": ["^\\.github/"], "never": ["^no-such-path$"]}'
      - name: The outputs have the documented shape
        env:
          CODE: ${{ steps.changes.outputs.code }}
          MATCHES: ${{ steps.changes.outputs.matches }}
          NEVER: ${{ fromJSON(steps.changes.outputs.matches).never }}
        run: |
          set -euo pipefail
          echo "code=$CODE matches=$MATCHES"
          case "$CODE" in true|false) ;; *) echo "::error::code is '$CODE'"; exit 1 ;; esac
          jq -e 'keys == ["never", "workflows"] and all(.[]; . == "true" or . == "false")' <<<"$MATCHES"
          # A path no change can touch matches only when everything runs.
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$NEVER" != false ]; then
            echo "::error::'never' matched on a pull request"
            exit 1
          fi

  # go-release.yml's snapshot path, by local path, from a job granted only
  # `contents: read` — exactly what a caller's render job has — against a
  # fixture config that builds a binary, an archive, a Homebrew formula and
  # an image. render-checks then consumes the artifact the way sh's
  # formula and image checks do, so a snapshot that stops handing over dist/
  # (or its images) fails here first.
  render:
    name: Render a release
    permissions:
      contents: read
    uses: ./.github/workflows/go-release.yml
    with:
      snapshot: true
      goreleaser-config: internal/testdata/release/goreleaser.yaml
      test-command: ''
      release-notes: generated
      snapshot-artifact: release-snapshot-fixture
      snapshot-retention-days: 1

  render-checks:
    name: Render checks
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.render.outputs.snapshot-artifact }}
          path: dist
      - name: The artifact carries what the render built
        env:
          ARTIFACT: ${{ needs.render.outputs.snapshot-artifact }}
        run: |
          set -euo pipefail
          [ "$ARTIFACT" = release-snapshot-fixture ] || { echo "::error::output snapshot-artifact is '$ARTIFACT'"; exit 1; }
          ls -l dist dist/homebrew/Formula
          for kind in Binary Archive Checksum "Homebrew Formula" "Docker Image"; do
            n="$(jq --arg k "$kind" '[.[] | select(.type == $k)] | length' dist/artifacts.json)"
            echo "$kind: $n"
            [ "$n" -ge 1 ] || { echo "::error::artifacts.json lists no $kind"; exit 1; }
          done
          grep -q 'bin.install "baseline"' dist/homebrew/Formula/baseline-fixture.rb
          test -s dist/docker-images.tar
      - name: The image loads and runs
        run: |
          set -euo pipefail
          docker load -i dist/docker-images.tar
          ref="$(jq -r '.[] | select(.type == "Docker Image") | .name' dist/artifacts.json | head -1)"
          docker run --rm "$ref" knobs | tee knobs.txt
          grep -q '^golangci.settings-pending ' knobs.txt
