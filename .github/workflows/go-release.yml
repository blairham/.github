name: Go release

# GoReleaser + keyless cosign + build provenance, as one reusable workflow. A
# signed v* tag is still the release — `go get` resolves tags — and this
# publishes the evidence beside it: what .goreleaser.yaml builds (binaries,
# a source archive, images), a cosign-signed checksums.txt, and SLSA build
# provenance for every file checksums.txt lists, stored in GitHub's
# attestation store and attached to the release as
# `<repo>-<tag>.intoto.jsonl`.
#
# The caller's release.yml triggers on `push: tags: ["v*"]` and
# `workflow_dispatch` and calls this pinned by commit SHA. What gets built is
# the caller's .goreleaser.yaml, so a library (source archive only) and a CLI
# with a Homebrew formula call it identically.
#
# Signing identity. Keyless signatures and attestations are issued to the
# workflow that ran the signing step, and in a reusable workflow that is THIS
# file, not the caller's release.yml. The certificate's SAN is
#   https://github.com/blairham/.github/.github/workflows/go-release.yml@<sha>
# and its GitHub Workflow Repository / Ref extensions name the calling
# repository and tag. Verify with:
#   cosign verify-blob \
#     --certificate-identity-regexp '^https://github\.com/blairham/\.github/\.github/workflows/go-release\.yml@' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-github-workflow-repository blairham/<repo> \
#     --certificate-github-workflow-ref refs/tags/<tag> \
#     --bundle checksums.txt.sigstore.json checksums.txt
#   gh attestation verify <file> --repo blairham/<repo> \
#     --signer-workflow blairham/.github/.github/workflows/go-release.yml
#
# Permissions. The jobs here declare none, so they get exactly what the
# calling job grants — a callee may not ask for more than its caller has, and
# what a release needs varies (packages: write only when images are pushed).
# The calling job grants:
#   contents: write      the GitHub release and its assets
#   id-token: write      keyless cosign and the provenance attestation
#   attestations: write  the attestation store
#   packages: write      only with `images`
on:
  workflow_call:
    inputs:
      tag:
        description: >-
          Tag to release. Empty means the tag that triggered the caller
          (github.ref_name). A workflow_dispatch caller passes its input.
        type: string
        default: ''
      release-notes:
        description: >-
          'changelog': the tag's `## [X.Y.Z]` section of CHANGELOG.md, which
          must exist. 'generated': GoReleaser's commit list.
        type: string
        default: changelog
      test-command:
        description: Runs before anything is published.
        type: string
        default: go test -race ./...
      images:
        description: >-
          JSON array of image names GoReleaser pushes (dockers_v2), e.g.
          '["ghcr.io/blairham/x"]'. Each gets provenance attested on the
          digest GoReleaser recorded. Empty array: no images, no ghcr login.
        type: string
        default: '[]'
      charts:
        description: >-
          JSON array of chart directories whose Chart.yaml appVersion must
          equal the tag before anything is published (an unset image.tag
          falls back to appVersion, so a stale chart installs the previous
          release). Publishing the charts is go-chart.yml's job.
        type: string
        default: '[]'
      snapshot:
        description: >-
          Dry run: build everything with `goreleaser release --snapshot
          --skip=publish,sign` and publish, sign and attest nothing. Proves
          the configuration and the build; the signing path is proven only
          by a real tag.
        type: boolean
        default: false
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: Fine-grained token with contents:write on blairham/homebrew-tap, for a `brews:` formula.
        required: false
      MACOS_SIGN_P12:
        description: Apple Developer ID certificate (base64 .p12) for notarize.macos.
        required: false
      MACOS_SIGN_PASSWORD:
        description: Password for MACOS_SIGN_P12.
        required: false
      MACOS_NOTARY_ISSUER_ID:
        description: App Store Connect API issuer ID.
        required: false
      MACOS_NOTARY_KEY_ID:
        description: App Store Connect API key ID.
        required: false
      MACOS_NOTARY_KEY:
        description: App Store Connect API private key.
        required: false
    outputs:
      digests:
        description: JSON object mapping each image in `images` to its pushed index digest.
        value: ${{ jobs.release.outputs.digests }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.images.outputs.digests }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      SNAPSHOT: ${{ inputs.snapshot }}
    steps:
      - name: Check inputs
        env:
          NOTES: ${{ inputs.release-notes }}
        run: |
          set -euo pipefail
          case "$NOTES" in
            changelog|generated) ;;
            *) echo "::error::release-notes must be changelog or generated, not '$NOTES'"; exit 1 ;;
          esac
          if [ "$SNAPSHOT" != true ] && [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::'$TAG' is not a v* tag; pass inputs.tag, or set snapshot for a dry run"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A dry run builds whatever ref the caller ran on.
          ref: ${{ !inputs.snapshot && (inputs.tag || github.ref) || '' }}
          fetch-depth: 0 # tags + history: GoReleaser finds the previous tag

      # The toolchain go.mod pins, not "stable": the released binary must be
      # the one CI tested, not whatever Go shipped this morning.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false # replaced by the release-scoped cache below
      # setup-go's cache is exact-match on go.sum and usually saved by CI test
      # jobs (host-platform builds only); this one falls back on a prefix and
      # is saved after GoReleaser, so it warms every cross-compiled target.
      - name: Restore release Go cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-release-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: |
            go-release-${{ runner.os }}-

      # The tag should only ever point at a commit CI already passed, but a
      # release is the one place a second look costs nothing that matters.
      - name: Run tests
        env:
          CMD: ${{ inputs.test-command }}
        run: eval "$CMD"

      # The notes are the tag's section of CHANGELOG.md, written for people
      # upgrading, rather than GoReleaser's list of commit subjects. A tag
      # whose section is missing or empty fails here instead of publishing
      # empty notes. (Do not set `changelog.disable` in .goreleaser.yaml: it
      # also skips the stage that reads --release-notes.)
      - name: Extract release notes
        id: notes
        env:
          NOTES: ${{ inputs.release-notes }}
        run: |
          set -euo pipefail
          if [ "$NOTES" = generated ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::release-notes is 'changelog' but there is no CHANGELOG.md"
            exit 1
          fi
          if [ "$SNAPSHOT" = true ]; then
            echo "::notice::snapshot: not extracting notes for $TAG"
            echo "args=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${TAG#v}"
          awk -v head="## [$version]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/       { exit }
            on                   { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::CHANGELOG.md has no section for $version; move [Unreleased] under '## [$version] - <date>' before tagging"
            exit 1
          fi
          echo "args=--release-notes $RUNNER_TEMP/notes.md" >> "$GITHUB_OUTPUT"

      - name: Confirm the charts name this version
        if: inputs.charts != '[]' && !inputs.snapshot
        env:
          CHARTS: ${{ inputs.charts }}
        run: |
          set -euo pipefail
          status=0
          for dir in $(jq -r '.[]' <<<"$CHARTS"); do
            app="$(sed -n 's/^appVersion: *"\{0,1\}\([^"]*\)"\{0,1\}$/\1/p' "$dir/Chart.yaml")"
            if [ "$app" != "${TAG#v}" ]; then
              echo "::error::$dir/Chart.yaml appVersion is '$app' but the tag is $TAG; bump the chart and re-tag"
              status=1
            fi
          done
          exit "$status"

      # An image whose Dockerfile RUNs anything in its target-platform stage
      # (ghorg's `apk add`) needs emulation for every architecture but the
      # runner's own; buildx otherwise fails with `exec format error` after
      # the GitHub release is already public. Registering binfmt costs a few
      # seconds and changes nothing for an image that only COPYs.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: inputs.images != '[]'
      # The default docker driver cannot push a multi-arch manifest list;
      # without buildx the release fails at its last step, after the GitHub
      # release is already public.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.images != '[]'
      - name: Log in to ghcr.io
        if: inputs.images != '[]' && !inputs.snapshot
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: ${{ !inputs.snapshot }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          # A snapshot still runs `signs` unless told not to, and would ask
          # for an OIDC token a dry run should not use.
          args: >-
            release --clean
            ${{ inputs.snapshot && '--snapshot --skip=publish,sign' || steps.notes.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # The notarize block in .goreleaser.yaml self-disables when
          # MACOS_SIGN_P12 is unset, so releases work without these.
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_SIGN_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - name: Show what was built
        run: |
          set -euo pipefail
          ls -l dist/
          test -s dist/checksums.txt || { echo "::error::GoReleaser wrote no checksums.txt"; exit 1; }
          cat dist/checksums.txt

      # SLSA build provenance for every file checksums.txt lists. A
      # SHA-pinned step, not slsa-github-generator's reusable workflow, which
      # verifies its own ref and so can only be tag-pinned.
      - name: Attest build provenance
        id: attest
        if: ${{ !inputs.snapshot }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      # The same bundle as a release asset: OpenSSF Scorecard's
      # Signed-Releases check finds provenance by an .intoto.jsonl asset; it
      # does not read the attestation store.
      - name: Attach the provenance to the release
        if: ${{ !inputs.snapshot }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/$REPO-$TAG.intoto.jsonl"
          gh release upload "$TAG" "$RUNNER_TEMP/$REPO-$TAG.intoto.jsonl" --clobber --repo "$GITHUB_REPOSITORY"

      # Each image's multi-arch index digest as GoReleaser recorded it, not
      # re-resolved from the registry. Anything but exactly one digest per
      # image fails the release.
      - name: Find the image digests
        id: images
        if: inputs.images != '[]' && !inputs.snapshot
        env:
          IMAGES: ${{ inputs.images }}
        run: |
          set -euo pipefail
          out='{}'
          for img in $(jq -r '.[]' <<<"$IMAGES"); do
            digests="$(jq -r --arg ref "$img:" '
              [.[] | select(.name | startswith($ref))]
              | (map(select(.type == "Docker Manifest")) | if length > 0 then . else empty end)
                // map(select(.type == "Docker Image"))
              | map(.extra.Digest // empty) | unique | .[]
            ' dist/artifacts.json)"
            count="$(printf '%s' "$digests" | grep -c '^sha256:[0-9a-f]\{64\}$' || true)"
            if [ "$count" -ne 1 ]; then
              echo "::error::expected one $img digest in dist/artifacts.json, found $count: ${digests:-none}"
              exit 1
            fi
            out="$(jq -c --arg k "$img" --arg v "$digests" '. + {($k): $v}' <<<"$out")"
          done
          echo "digests=$out" >> "$GITHUB_OUTPUT"

  # Image provenance, one attestation per image, pushed to the registry
  # beside the image. A matrix rather than a loop because the attest action
  # takes one subject name at a time.
  attest-images:
    name: Attest ${{ matrix.image }}
    needs: release
    if: inputs.images != '[]' && !inputs.snapshot
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: ${{ fromJSON(inputs.images) }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ fromJSON(needs.release.outputs.digests)[matrix.image] }}
          push-to-registry: true
